# How a member's visit notes become a case ready for a coordinator: one short
# run, from the notes to a draft, then the case waits (as data, not as a paused
# run) for the coordinator's decision, which starts graphs/case-decision.yaml.
# Rootstock refuses to start if a graph is broken or unsafe (GraphValidator).
apiVersion: rootstock/v1
kind: Graph
metadata:
  name: case-intake
  version: 2.0.0
  pack: vinnies
  description: Visit notes in, a checked and drafted case out, waiting for a coordinator.

trigger: { kind: submit }

state:
  channels:
    record:    { reducer: replace, description: The case record extracted from the notes. }
    context:   { reducer: merge, description: What enrich looked up in the Vinnies system. }
    # Replace, not append: each validate pass recomputes every issue, so one
    # fixed later must disappear. Their history is in the audit.
    issues:    { reducer: replace, description: Problems found by validate. }
    questions: { reducer: replace, description: Questions clarify asks the member. }
    # Replace: each draft is the whole proposal.
    actions:   { reducer: replace, description: Proposed changes for review. }
    audit:     { reducer: append, description: What each node did. }

nodes:
  - { id: ingest,  type: ingest }
  - { id: extract, agent: case-extractor }
  - { id: enrich,  agent: context-enricher }
  - id: validate
    type: rules
    config: { judge: consistency-judge }
  - id: clarify
    type: clarify
    config: { questionWriter: clarifier, maxRounds: 2 }
  - id: draft
    agent: action-drafter
    config: { actionTypes: [REFERRAL, FOLLOW_UP] }
  - id: chase
    agent: chase-writer
    config: { actionType: CHASE_MESSAGE }

edges:
  - { from: START,   to: ingest }
  - { from: ingest,  to: extract }
  - { from: extract, to: enrich }
  - { from: enrich,  to: validate }
  - from: validate
    route:
      # A blocking issue the member who wrote the notes can answer: ask them.
      - { when: { issues.anySeverity: BLOCKING, issues.answerableBy: SUBMITTER }, to: clarify }
      # Any other blocking issue: only the household (or another party) can answer.
      - { when: { issues.anySeverity: BLOCKING }, to: chase }
      - { default: draft }
  - { from: clarify, to: END }
  - { from: draft,   to: END }
  - { from: chase,   to: END }

# How the case stands when the run ends, by the node it ended after.
outcomes:
  # Questions for the member (answering them comes in Iteration 11).
  clarify: [{ status: AWAITING_SUBMITTER }]
  # A draft, or a message to the household: a coordinator decides either way.
  draft:   [{ status: AWAITING_DECISION, next: case-decision }]
  chase:   [{ status: AWAITING_DECISION, next: case-decision }]

runtime:
  checkpointer: memory          # runs are short; the case waits between runs, as data
  maxSteps: 40
