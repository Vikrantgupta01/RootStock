apiVersion: rootstock/v1
kind: Agent
metadata:
  name: action-drafter
  description: Proposes referrals and a follow-up for the coordinator to review.
spec:
  type: drafter
  model: drafting
  prompt: { name: vinnies/draft-actions, label: production }
  input:  { record: $.record, context: $.context, issues: $.issues }
  output: { writeTo: actions }
  limits: { timeoutSeconds: 60, retries: 1 }
