spring:
  # Tests run against a Testcontainers Postgres wired via @ServiceConnection, for
  # document/version/job bookkeeping only -- no vector data lives there anymore.
  # No AWS calls: the AI models are disabled so the context loads without
  # credentials, and BedrockKnowledgeBaseClient is mocked. Slice tests mock
  # ChatService directly.
  ai:
    model:
      chat: none
      embedding: none

rootstock:
  rag:
    bedrock:
      knowledge-base-id: test-kb
      data-source-id: test-ds
    blob:
      backend: filesystem
      filesystem:
        dir: ${java.io.tmpdir}/rootstock-test-blobs
    ingest:
      # Integration tests drive ingestion explicitly instead of via the scheduler.
      poller-enabled: false

logging:
  level:
    com.rootstock: DEBUG
