spring:
  # Tests run against a Testcontainers Postgres (pgvector image) wired via
  # @ServiceConnection. No AWS calls: the AI models are disabled so the context
  # loads without credentials. Slice tests mock ChatService directly.
  ai:
    model:
      chat: none
      embedding: none

rootstock:
  rag:
    embedding:
      mode: fake
    blob:
      backend: filesystem
      filesystem:
        dir: ${java.io.tmpdir}/rootstock-test-blobs
    ingest:
      # Integration tests drive ingestion explicitly instead of via the scheduler.
      poller-enabled: false

logging:
  level:
    com.rootstock: DEBUG
