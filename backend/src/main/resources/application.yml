spring:
  application:
    name: rootstock

  autoconfigure:
    # RootStock builds its EmbeddingModel(s) and PgVectorStore(s) programmatically
    # (see com.rootstock.rag.vector) so several embedding models can coexist, one
    # physical table per dimension. Spring AI's single-store auto-configuration
    # would clash, so it stays excluded.
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rootstock}
    username: ${DB_USERNAME:rootstock}
    password: ${DB_PASSWORD:rootstock}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      # Chat is served by AWS Bedrock (Converse API). Requires AWS credentials with
      # Bedrock model access on the runtime (default AWS provider chain).
      chat: bedrock-converse
      # RAG embeddings are managed by com.rootstock.rag.vector.EmbeddingModelRegistry,
      # not Spring AI auto-configuration -- keep this off.
      embedding: none
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            # Override with a model / inference-profile id your AWS account has
            # been granted access to in the target region.
            model: ${BEDROCK_MODEL:us.anthropic.claude-sonnet-4-20250514-v1:0}
            temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: RootStock
    description: RootStock backend API

rootstock:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    system-prompt: >
      You are RootStock's assistant. Be concise, accurate, and helpful.
  rag:
    tenant:
      header: X-Tenant-Id
      default-tenant: default
    blob:
      # filesystem (default, no infra) or s3 (real AWS, or MinIO/LocalStack via endpoint)
      backend: ${RAG_BLOB_BACKEND:filesystem}
      filesystem:
        dir: ${RAG_BLOB_DIR:./data/blobs}
      s3:
        bucket: ${RAG_S3_BUCKET:rootstock-rag}
        endpoint: ${RAG_S3_ENDPOINT:}
        region: ${AWS_REGION:us-east-1}
        path-style-access: true
      presign-ttl: 15m
    bedrock:
      # AWS Bedrock Knowledge Base (Aurora PostgreSQL Serverless v2 vector store)
      # backing RAG retrieval/ingestion. Replaces the pgvector-based pipeline below
      # once the Phase 4 cutover lands -- see the migration plan.
      knowledge-base-id: ${RAG_BEDROCK_KB_ID:}
      data-source-id: ${RAG_BEDROCK_DATA_SOURCE_ID:}
      region: ${AWS_REGION:us-east-1}
    embedding:
      # fake (offline, deterministic) or bedrock (Titan Text Embeddings v2)
      mode: ${RAG_EMBEDDING_MODE:fake}
      fake-dimensions: 1024
      region: ${AWS_REGION:us-east-1}
    ingest:
      poll-interval-ms: 5000
      batch-size: 5
      max-attempts: 3
    defaults:
      chunking-strategy: CHARACTER
      chunk-size: 1200
      chunk-overlap: 150
      embedding-model-id: ${RAG_EMBEDDING_MODEL:fake}
      top-k: 4
      similarity-threshold: 0.5
      max-context-tokens: 4000

logging:
  level:
    com.rootstock: DEBUG
    org.springframework.ai: INFO
