spring:
  application:
    name: rootstock

  autoconfigure:
    # The pgvector VectorStore needs an EmbeddingModel. Embeddings are deferred
    # until the RAG pipeline is built, so its auto-configuration is excluded here.
    # Re-enable by removing this line and setting an embedding provider (README).
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rootstock}
    username: ${DB_USERNAME:rootstock}
    password: ${DB_PASSWORD:rootstock}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      # Chat is served by AWS Bedrock (Converse API). Requires AWS credentials with
      # Bedrock model access on the runtime (default AWS provider chain).
      chat: bedrock-converse
      # Embeddings are off until the RAG pipeline is built. Flip to `bedrock-titan`
      # (see README) to activate the pgvector VectorStore auto-configuration.
      embedding: none
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            # Override with a model / inference-profile id your AWS account has
            # been granted access to in the target region.
            model: ${BEDROCK_MODEL:us.anthropic.claude-sonnet-4-20250514-v1:0}
            temperature: 0.7
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1024
        index-type: hnsw

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: RootStock
    description: RootStock backend API

rootstock:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    system-prompt: >
      You are RootStock's assistant. Be concise, accurate, and helpful.

logging:
  level:
    com.rootstock: DEBUG
    org.springframework.ai: INFO
