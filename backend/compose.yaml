services:
  db:
    image: 'pgvector/pgvector:pg16'
    environment:
      - 'POSTGRES_DB=rootstock'
      - 'POSTGRES_USER=rootstock'
      - 'POSTGRES_PASSWORD=rootstock'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '5432:5432'
    volumes:
      - 'rootstock_pgdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rootstock -d rootstock']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rootstock_pgdata:
