spring:
  config:
    # Client systems Rootstock may call over MCP (rootstock.tools.*). Rootstock
    # ships none: a domain supplies them in its own file, named here by path.
    # Unset, nothing is imported and no MCP connection exists.
    import: optional:file:${ROOTSTOCK_TOOLS_FILE:}
  application:
    name: rootstock

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

  datasource:
    # No local defaults: without DB_* (from .env) the app refuses to start, rather
    # than quietly connecting to some other database on localhost.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  ai:
    model:
      # Chat is served by AWS Bedrock (Converse API). Requires AWS credentials with
      # Bedrock model access on the runtime (default AWS provider chain).
      chat: bedrock-converse
      # RAG embeddings happen inside the Bedrock Knowledge Base (see rootstock.rag.bedrock),
      # invisible to this app -- no EmbeddingModel bean is needed here.
      embedding: none
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
      converse:
        chat:
          options:
            # Override with a model / inference-profile id your AWS account has
            # been granted access to in the target region. claude-sonnet-4
            # (the prior default) was marked LEGACY by the provider;
            # claude-sonnet-5 is newer but gated behind an AWS Sales
            # entitlement this account doesn't have yet -- claude-sonnet-4-5
            # is active and actually invokable as of 2026-09.
            model: ${BEDROCK_MODEL:us.anthropic.claude-sonnet-4-5-20250929-v1:0}
            temperature: 0.7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

  # Tracing exists only to feed Langfuse, so it is bound to the same switch.
  # `opentelemetry.enabled: false` is the decisive one: it makes traces, metrics
  # and logging no-op implementations, so no exporter is built, no batch thread
  # runs and nothing is logged. An environment that never sets LANGFUSE_ENABLED
  # therefore carries the dependency inert -- no startup risk, no noise.
  # Belt and braces: micrometer-registry-otlp is excluded in pom.xml, but if it
  # ever returns transitively this stops it pushing metrics at localhost:4318.
  # It lives under a different namespace from management.opentelemetry.* and is
  # therefore NOT covered by the switch below -- that gap is what caused a
  # ConnectException on every publish interval.
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    # Both this and the OTLP endpoint are overridden at startup by
    # LangfuseEnvironmentPostProcessor, which turns OpenTelemetry on only when
    # Langfuse is both enabled and fully configured. Boot creates an exporter
    # only when the endpoint property is set, so it cannot be declared here:
    # that would export unauthenticated from every key-less environment.
    enabled: ${LANGFUSE_ENABLED:true}
    tracing:
      export:
        otlp:
          # Langfuse accepts OTLP over HTTP only; it does not support gRPC.
          # The Basic auth header is added by LangfuseExporterConfig.
          protocol: http
  tracing:
    sampling:
      # Every request, which is what you want while building this. If the
      # Langfuse free-tier quota starts to bite, this is the lever.
      probability: ${LANGFUSE_SAMPLE_RATE:1.0}
  observations:
    enable:
      # Langfuse is for LLM work. Everything below is framework plumbing that
      # buries the actual call tree, and -- more importantly -- wraps it: while
      # any of these are enabled the application's own span is NOT the root, and
      # Langfuse reads a trace's name, session, user and tags from the root span.
      # Audited against a live trace, which showed a "security filterchain"
      # observation as the root of every request.
      http.server.requests: false
      http.client.requests: false
      spring.security: false
      tasks.scheduled.execution: false
      # Spring AI's own wrappers around the model call. The generation itself
      # (gen_ai.client.operation) is kept -- it carries model and token usage --
      # but the advisor/tool-calling scaffolding around it is noise here.
      spring.ai.chat.client: false
      spring.ai.tool: false
      spring.ai.advisor: false

info:
  app:
    name: RootStock
    description: RootStock backend API

rootstock:
  observability:
    langfuse:
      # Keys live in rootstock-core/.env, never here -- application.yml is committed.
      # Every value defaults to blank: a missing env var must not stop the app.
      enabled: ${LANGFUSE_ENABLED:true}
      # Neither of these is a secret: the host is a public endpoint and the flag
      # is a deployment choice, so they carry real defaults here. Only the key
      # pair lives in .env. LANGFUSE_BASE_URL is accepted as an alias for the
      # host because that is the name langfuse-cli uses, so a .env written for
      # the CLI works unchanged.
      host: ${LANGFUSE_HOST:${LANGFUSE_BASE_URL:https://us.cloud.langfuse.com}}
      # Langfuse environment on every trace, keeping local traffic out of
      # production dashboards. A setting, not a Spring profile (one configuration).
      environment: ${LANGFUSE_ENVIRONMENT:development}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  chat:
    system-prompt: >
      You are RootStock's assistant. Be concise, accurate, and helpful.
  agent:
    # Reason steps per question (each is one model call). The system prompt
    # defaults to the one in AgentProperties; override it here if needed.
    max-iterations: ${AGENT_MAX_ITERATIONS:6}
  llm:
    # Model profiles case agents name in their YAML (model: extraction). A blank
    # model means the default chat model (BEDROCK_MODEL). Low temperature for
    # extraction and checks; a little higher for drafted messages.
    profiles:
      extraction:
        model: ${LLM_EXTRACTION_MODEL:}
        temperature: 0.0
        max-tokens: 4096
      fast:
        model: ${LLM_FAST_MODEL:us.anthropic.claude-haiku-4-5-20251001-v1:0}
        temperature: 0.0
        max-tokens: 2048
      drafting:
        model: ${LLM_DRAFTING_MODEL:}
        temperature: 0.4
        max-tokens: 4096
    prompts:
      # Prompts come from Langfuse by name and label, cached this long; when it is
      # unreachable or lacks one, the copy in the pack's prompts/ folder is used.
      cache-ttl: ${LLM_PROMPT_CACHE_TTL:5m}
      fetch-timeout: 5s
  cases:
    # Each stub node takes this long, so a run's progress is visible on the
    # Cases screen. Goes away as real nodes replace the stubs.
    stub-pause: ${CASES_STUB_PAUSE:600ms}
  packs:
    # Folders holding domain packs (ontology, graph, tools YAML), comma
    # separated; each may be one pack or a folder of packs. Rootstock ships none.
    paths: ${ROOTSTOCK_PACKS_PATHS:}
  auth:
    cognito:
      # Identity provider for the whole API. Pool and client ids are public
      # identifiers in every OIDC flow, not secrets.
      region: ${AWS_REGION:us-east-1}
      user-pool-id: ${COGNITO_USER_POOL_ID:us-east-1_eJI6vUhpH}
      client-id: ${COGNITO_CLIENT_ID:129t4ms9c91dgdmu77rpf2r0ug}
  rag:
    blob:
      # s3 (default) or filesystem. Bedrock Knowledge Base ingestion reads from
      # real S3, so documents stored on the filesystem are never indexed.
      backend: ${RAG_BLOB_BACKEND:s3}
      filesystem:
        dir: ${RAG_BLOB_DIR:./data/blobs}
      s3:
        bucket: ${RAG_S3_BUCKET:rootstock.rag.blob.s3.bucket}
        endpoint: ${RAG_S3_ENDPOINT:}
        region: ${AWS_REGION:us-east-1}
        path-style-access: true
      presign-ttl: 15m
    bedrock:
      # AWS Bedrock Knowledge Base (Aurora PostgreSQL Serverless v2 vector store)
      # backing RAG ingestion and retrieval -- owns parsing, chunking, and embedding.
      knowledge-base-id: ${RAG_BEDROCK_KB_ID:HX3QBBNC0M}
      data-source-id: ${RAG_BEDROCK_DATA_SOURCE_ID:JFDCCZVP11}
      region: ${AWS_REGION:us-east-1}
    ingest:
      poll-interval-ms: 5000
      batch-size: 5
      max-attempts: 3
    defaults:
      top-k: 4
      similarity-threshold: 0.5
      max-context-tokens: 4000

logging:
  level:
    com.rootstock: DEBUG
    org.springframework.ai: INFO
    # Bounded, known noise: if Langfuse is configured but unreachable the SDK
    # logs failed export batches. Set to OFF to silence it entirely.
    io.opentelemetry.exporter: ${LANGFUSE_EXPORTER_LOG_LEVEL:WARN}
